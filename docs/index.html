<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1726">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MIDI Box">
<title>ESP32 MIDI Box Player</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #18202e; --muted: #667085; --line: #dfe3ea;
    --accent: #2563eb; --accent-text: #ffffff; --ok: #16a34a; --warn: #d97706; --danger: #dc2626;
    --current: #e8efff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1726; --card: #182235; --text: #e7ecf5; --muted: #95a1b5; --line: #2a3650;
      --accent: #4c8dff; --accent-text: #ffffff; --ok: #34d399; --warn: #fbbf24; --danger: #f87171;
      --current: #1f3157;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1726; --card: #182235; --text: #e7ecf5; --muted: #95a1b5; --line: #2a3650;
    --accent: #4c8dff; --accent-text: #ffffff; --ok: #34d399; --warn: #fbbf24; --danger: #f87171;
    --current: #1f3157;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .01em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  button {
    font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px; cursor: pointer; min-height: 44px;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .conn { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .conn .who { display: grid; }
  #status { font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  #status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  #status[data-state="connected"]::before { background: var(--ok); }
  #status[data-state="connecting"]::before { background: var(--warn); }
  #devName { color: var(--muted); font-size: 14px; }
  .notice { border-color: var(--warn); }
  .notice p { margin: 0; font-size: 14px; }
  #title { font-size: 18px; font-weight: 600; margin: 0 0 10px; overflow-wrap: anywhere; }
  .time { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px;
          font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 6px 0; }
  .transport { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
  .transport button { font-size: 20px; }
  .transport #play { font-size: 22px; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .row label { color: var(--muted); font-size: 14px; white-space: nowrap; }
  #volVal { width: 3ch; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
  .extra { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .extra label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  #panic { border-color: var(--danger); color: var(--danger); }
  .libhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .libhead h2 { font-size: 16px; margin: 0; }
  #list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  #list li { display: flex; gap: 6px; border-radius: 12px; }
  #list li.current .song { background: var(--current); border-color: var(--accent); }
  #list .song { flex: 1; text-align: left; overflow-wrap: anywhere; }
  #list .del { flex: none; width: 44px; padding: 0; color: var(--muted); }
  #empty { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .diag { color: var(--muted); font-size: 12px; text-align: center; margin: 0; font-variant-numeric: tabular-nums; min-height: 1.5em; }
  footer { color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ESP32 MIDI Box Player</h1>
  </header>

  <section class="card notice" id="noBle" hidden>
    <p>このブラウザは Web Bluetooth に対応していません。iPhone では <b>Bluefy</b> などの
      Web Bluetooth 対応ブラウザで開いてください。PC / Android は Chrome か Edge を使ってください。</p>
  </section>

  <section class="card conn">
    <div class="who">
      <span id="status" data-state="disconnected">未接続</span>
      <span id="devName"></span>
    </div>
    <button id="connect" class="primary">BLE-MIDI に接続</button>
  </section>

  <section class="card">
    <p id="title">曲を選んでください</p>
    <input type="range" id="seek" min="0" max="0" value="0" step="100" aria-label="再生位置">
    <div class="time"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    <div class="transport">
      <button id="prev" aria-label="前の曲">⏮</button>
      <button id="play" class="primary" aria-label="再生">▶</button>
      <button id="stop" aria-label="停止">■</button>
      <button id="next" aria-label="次の曲">⏭</button>
    </div>
    <div class="row">
      <label for="vol">音量</label>
      <input type="range" id="vol" min="0" max="100" value="80">
      <span id="volVal">80</span>
    </div>
    <div class="extra">
      <label><input type="checkbox" id="repeat"> 最後まで行ったら先頭から</label>
      <button id="panic">音を止める</button>
    </div>
  </section>

  <section class="card">
    <div class="libhead">
      <h2>曲リスト</h2>
      <button id="add">＋ MIDI ファイルを追加</button>
    </div>
    <input type="file" id="file" multiple hidden>
    <ul id="list"></ul>
    <p id="empty">.mid ファイルを追加してください。追加した曲はこのブラウザに保存されます。</p>
  </section>

  <p id="diag" class="diag"></p>
  <footer>画面を閉じたり他のアプリに切り替えると再生が止まります</footer>
</main>
<script src="smf.js"></script>
<script src="app.js"></script>
</body>
</html>
