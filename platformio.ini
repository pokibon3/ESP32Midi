; ESP32-S3-BOX-Lite  SoundFont(SF2) GM音源
;
;   pio run -t upload        ... ファームウェア書き込み
;   pio run -t uploadsf2     ... SoundFont を sf2 パーティションへ書き込み
;   pio device monitor       ... シリアルモニタ

[platformio]
default_envs = esp32s3box-lite

[env:esp32s3box-lite]
; Arduino-ESP32 3.x (USBMIDI クラスが必要なため pioarduino を使用)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32s3box
framework = arduino

; ESP32-S3-WROOM-1-N16R8 (Flash 16MB QIO / PSRAM 8MB OPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 921600
; TinyUSB CDC は 1200bps touch でダウンロードモードへ再起動する (scripts/upload_sf2.py)。
; 強制ダウンロードフラグが残るので、書き込み後はウォッチドッグリセットでアプリを起動する
custom_usb_touch = yes
board_upload.after_reset = watchdog-reset

; USB を TinyUSB(OTG) モードにして CDC + USB-MIDI の複合デバイスにする
build_unflags =
    -DARDUINO_USB_MODE=1
    -Os
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; USB ライブラリ(USBHostMSC)が FS.h を参照するため
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -O2
    ; ---- シンセ設定 ----
    -DSYNTH_SAMPLE_RATE=32000
    -DSYNTH_MAX_VOICES=128
    ; I2S DMA バッファ (3 x 128 フレーム = 12ms @32kHz)
    -DAUDIO_DMA_DESC=3
    -DAUDIO_DMA_FRAMES=128
    ; UART MIDI 入力 (31250bps)。使わない場合は -1
    -DMIDI_UART_RX_PIN=-1

lib_deps =
    lovyan03/LovyanGFX@^1.2.7

; pio run -t uploadsf2 で書き込む SoundFont
custom_sf2_file = soundfont/default.sf2
extra_scripts = post:scripts/upload_sf2.py

; デバッグ用: USB を内蔵 USB-Serial-JTAG にしてクラッシュログを見られるようにする
; (USB-MIDI は無効。MIDI は UART のみ)
[env:debug]
extends = env:esp32s3box-lite
build_unflags =
    -DARDUINO_USB_MODE=0
    -Os
build_flags =
    ${env:esp32s3box-lite.build_flags}
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
