; SoundFont(SF2) GM音源 (ESP32-S3 / RP2350)
;
;   pio run -e <env> -t upload      ... ファームウェア書き込み
;   pio run -e <env> -t uploadsf2   ... SoundFont をフラッシュの SF2 領域へ書き込み
;   pio device monitor              ... シリアルモニタ
;
; 環境:
;   esp32s3box-lite   ESP32-S3-BOX-Lite (ES8156 + 内蔵スピーカー + 液晶)
;   xiao-pcm5102      Seeed XIAO ESP32S3 + PCM5102A I2S DAC (ステレオ ライン出力)
;   weact-rp2350      WeAct RP2350A_V20 16MB + WeAct I2S Earphone V1 (64 ボイス, 150MHz)
;   weact-rp2350-128  同上 128 ボイス (240MHz オーバークロック)
;   debug             BOX-Lite のデバッグ用ビルド
;
; ソース: src/ は共通、src/platform/<esp32|rp2350>/ はプラットフォーム依存部

[platformio]
default_envs = esp32s3box-lite

; ---- 全ボード共通 ----
[env]
framework = arduino
monitor_speed = 115200
build_unflags = -Os
build_flags =
    -O2
    ; ---- シンセ設定 ----
    -DSYNTH_SAMPLE_RATE=32000

; pio run -t uploadsf2 で書き込む SoundFont
custom_sf2_file = soundfont/default.sf2
extra_scripts = post:scripts/upload_sf2.py

; ---- ESP32-S3 共通 ----
[esp32]
; Arduino-ESP32 3.x (USBMIDI クラスが必要なため pioarduino を使用)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
upload_speed = 921600
; TinyUSB CDC は 1200bps touch でダウンロードモードへ再起動する (scripts/upload_sf2.py)。
; 強制ダウンロードフラグが残るので、書き込み後はウォッチドッグリセットでアプリを起動する
custom_usb_touch = yes
board_upload.after_reset = watchdog-reset
build_src_filter = +<*> -<platform/> +<platform/esp32/>

; USB を TinyUSB(OTG) モードにして CDC + USB-MIDI の複合デバイスにする
build_unflags =
    ${env.build_unflags}
    -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; USB ライブラリ(USBHostMSC)が FS.h を参照するため
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -DSYNTH_MAX_VOICES=128
    ; 出力バッファ (3 x 128 フレーム = 12ms @32kHz)
    -DAUDIO_DMA_DESC=3
    -DAUDIO_DMA_FRAMES=128

; ---- ESP32-S3-BOX-Lite ----
; ESP32-S3-WROOM-1-N16R8 (Flash 16MB / PSRAM 8MB)
[env:esp32s3box-lite]
extends = esp32
board = esp32s3box
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_flags =
    ${esp32.build_flags}
    -DBOARD_BOX_LITE
    ; UART MIDI 入力 (31250bps)。使わない場合は -1
    -DMIDI_UART_RX_PIN=-1
lib_deps =
    lovyan03/LovyanGFX@^1.2.7

; ---- Seeed XIAO ESP32S3 + PCM5102A ----
; ESP32-S3R8 (Flash 8MB / PSRAM 8MB)。配線は src/board.h を参照
[env:xiao-pcm5102]
extends = esp32
board = seeed_xiao_esp32s3
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
build_flags =
    ${esp32.build_flags}
    -DBOARD_XIAO_PCM5102
    ; UART MIDI 入力 D7 (GPIO44)。使わない場合は -1
    -DMIDI_UART_RX_PIN=-1

; ---- デバッグ用 (BOX-Lite) ----
; USB を内蔵 USB-Serial-JTAG にしてクラッシュログを見られるようにする
; (USB-MIDI は無効。MIDI は UART / USB シリアルのみ)
[env:debug]
extends = env:esp32s3box-lite
build_unflags =
    ${env.build_unflags}
    -DARDUINO_USB_MODE=0
build_flags =
    ${env:esp32s3box-lite.build_flags}
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3

; ---- WeAct RP2350A_V20 (16MB) + WeAct I2S Earphone Module V1 ----
; arduino-pico (Earle Philhower) コア。配線は src/board.h を参照。
; SoundFont はフラッシュ末尾の filesystem 領域 (15MB) に生のまま置く
[rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
board_build.core = earlephilhower
board_upload.maximum_size = 16777216
board_build.filesystem_size = 15m
build_src_filter = +<*> -<platform/> +<platform/rp2350/>
build_flags =
    ${env.build_flags}
    -DBOARD_WEACT_RP2350
    ; USB スタックを Adafruit TinyUSB にする (CDC + USB-MIDI)。
    ; コア標準の USB スタックでは USB-MIDI を追加すると CDC / MIDI とも通信できなくなった
    -DUSE_TINYUSB
    ; 出力バッファ (8 x 64 フレーム = 16ms @32kHz)。コア 0 の USB 割り込みなどの揺らぎを吸収する
    -DAUDIO_DMA_DESC=8
    -DAUDIO_DMA_FRAMES=64
    ; UART MIDI 入力 GP1 (UART0 RX)。使わない場合は -1
    -DMIDI_UART_RX_PIN=1
    ; 診断用: 青 LED でメインループの状態を表示 (速い点滅 = 正常、N 回点滅 = 段階 N で停止)
    ; -DDIAG_LED

[env:weact-rp2350]
extends = rp2350
board_build.f_cpu = 150000000L
build_flags =
    ${rp2350.build_flags}
    -DSYNTH_MAX_VOICES=64

; 128 ボイス版。RP2350 の定格 (150MHz) を超えるオーバークロック。
; 150MHz で起動したあと、コア電圧 1.20V・フラッシュ分周を上げてから 240MHz にする
; (F_CPU=240MHz で起動すると立ち上がらなかった)
[env:weact-rp2350-128]
extends = rp2350
board_build.f_cpu = 150000000L
build_flags =
    ${rp2350.build_flags}
    -DSYNTH_MAX_VOICES=128
    -DSYNTH_CPU_MHZ=240
